<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Plane Radio</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --bg:#0b0f14; --panel:#131a23; --line:#223040; --txt:#dbe6f0; --dim:#7d8fa3; --accent:#34d399; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:14px/1.4 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; align-items:center; gap:12px; padding:10px 14px;
    background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; letter-spacing:.5px; font-weight:600; }
  h1 .ico { color:var(--accent); }
  .modes { display:flex; gap:6px; }
  button { background:#1c2733; color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:#3a516b; }
  button.on { background:var(--accent); color:#04261a; border-color:var(--accent); font-weight:600; }
  select { background:#1c2733; color:var(--txt); border:1px solid var(--line); border-radius:8px;
    padding:7px 8px; font-size:12px; }
  .spacer { flex:1; }
  #status { font-size:12px; color:var(--dim); }
  #status b { color:var(--txt); }
  #status.err { color:var(--err); }
  main { flex:1; position:relative; min-height:0; }
  #map { position:absolute; inset:0; }
  .leaflet-container { background:#0b0f14; }
  /* listen panel */
  #listen { position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:24px; text-align:center; }
  #listen .dial { font-size:46px; font-weight:700; letter-spacing:1px; }
  #listen .dial small { font-size:18px; color:var(--dim); font-weight:500; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .row label { font-size:12px; color:var(--dim); }
  input[type=number] { width:110px; background:#0f151c; color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:15px; }
  .presets button { font-size:12px; padding:5px 9px; }
  .hint { color:var(--dim); font-size:12px; max-width:460px; }
  .hint a { color:var(--accent); }
  audio { width:min(460px,90vw); margin-top:4px; }
  /* aircraft list overlay */
  #count { position:absolute; top:10px; right:10px; z-index:500; background:rgba(19,26,35,.9);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--dim); }
  .plane-ico svg { display:block; filter:drop-shadow(0 0 2px #000); }
  .lbl { background:rgba(11,15,20,.7); color:#cfe; font-size:10px; padding:0 3px; border-radius:3px;
    white-space:nowrap; border:1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="ico">✈</span> PLANE RADIO</h1>
    <div class="modes">
      <button id="bMap">🗺 Map</button>
      <button id="bListen">🎧 Listen</button>
      <button id="bStop">⏹ Stop</button>
    </div>
    <select id="mapSrc" title="Where map data comes from">
      <option value="api">Online (no dongle)</option>
      <option value="sdr">Dongle (local 1090)</option>
    </select>
    <div class="spacer"></div>
    <div id="status">idle</div>
  </header>
  <main>
    <div id="map"></div>
    <div id="count" style="display:none">0 aircraft</div>
    <div id="listen">
      <div class="dial"><span id="dialFreq">119.400</span> <small>MHz · AM</small></div>
      <div class="row">
        <label>Frequency (MHz)</label>
        <input type="number" id="freq" step="0.025" min="88" max="1700" value="119.400" />
        <label>Gain</label>
        <input type="number" id="gain" step="1" min="0" max="50" placeholder="auto" />
        <label>Squelch</label>
        <input type="number" id="squelch" step="1" min="0" value="0" />
        <button id="tune" class="on">Tune ▶</button>
      </div>
      <div class="row presets">
        <button data-f="119.400">119.400 Tower</button>
        <button data-f="121.900">121.900 Ground</button>
        <button data-f="127.800">127.800 ATIS</button>
        <button data-f="135.300">135.300 Toronto Ctr</button>
        <button data-f="126.700">126.700 London Radio</button>
        <button data-f="121.500">121.500 Guard</button>
      </div>
      <audio id="audio" controls autoplay></audio>
      <p class="hint">Aviation voice lives in <b>118–137 MHz AM</b>. Find your local tower /
        approach / ground frequencies at
        <a href="https://www.liveatc.net" target="_blank" rel="noopener">liveatc.net</a> or an
        airport's AIP. Raise <b>Squelch</b> to mute the static between transmissions.</p>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const statusEl = $("#status");

// ---- map ----
const map = L.map("map", { zoomControl:true, attributionControl:false })
  .setView([43.0356, -81.1539], 9); // London CYXU; auto-fits to planes when they appear
L.marker([43.0356, -81.1539], {
  icon: L.divIcon({ className:"", html:'<div style="font-size:18px">📍</div>', iconSize:[18,18], iconAnchor:[9,18] }),
}).addTo(map).bindTooltip("CYXU — you", { permanent:false });
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom:18 }).addTo(map);

const markers = new Map();
let fitted = false;
function planeIcon(track) {
  return L.divIcon({
    className: "plane-ico",
    html: `<svg width="22" height="22" viewBox="0 0 24 24" style="transform:rotate(${(track||0)}deg)">
      <path fill="#34d399" d="M12 2l2 7 7 3-7 1-2 8-2-8-7-1 7-3z"/></svg>`,
    iconSize:[22,22], iconAnchor:[11,11],
  });
}
function renderAircraft(list) {
  const seen = new Set();
  const pts = [];
  for (const a of list) {
    if (a.lat == null || a.lon == null) continue;
    seen.add(a.hex);
    pts.push([a.lat, a.lon]);
    const label = (a.flight && a.flight.trim()) || a.hex.toUpperCase();
    const tip = `${label}${a.alt!=null?` · ${a.alt}ft`:""}${a.speed!=null?` · ${a.speed}kt`:""}`;
    let m = markers.get(a.hex);
    if (!m) {
      m = L.marker([a.lat, a.lon], { icon: planeIcon(a.track) }).addTo(map);
      m.bindTooltip(tip, { permanent:true, direction:"right", className:"lbl", offset:[10,0] });
      markers.set(a.hex, m);
    } else {
      m.setLatLng([a.lat, a.lon]);
      m.setIcon(planeIcon(a.track));
      m.setTooltipContent(tip);
    }
  }
  for (const [hex, m] of markers) if (!seen.has(hex)) { map.removeLayer(m); markers.delete(hex); }
  $("#count").textContent = `${list.length} aircraft · ${pts.length} with position`;
  if (!fitted && pts.length) { map.fitBounds(pts, { padding:[40,40], maxZoom:10 }); fitted = true; }
}

// ---- SSE ----
let es;
function connect() {
  es = new EventSource("/events");
  es.addEventListener("status", (e) => applyStatus(JSON.parse(e.data)));
  es.addEventListener("aircraft", (e) => renderAircraft(JSON.parse(e.data)));
  es.onerror = () => { statusEl.textContent = "reconnecting…"; };
}
connect();

function setView(mode) {
  $("#map").style.display = mode === "map" ? "block" : "none";
  $("#count").style.display = mode === "map" ? "block" : "none";
  $("#listen").style.display = mode === "listen" ? "flex" : "none";
  $("#bMap").classList.toggle("on", mode === "map");
  $("#bListen").classList.toggle("on", mode === "listen");
  if (mode === "map") setTimeout(() => map.invalidateSize(), 50);
}

const audio = $("#audio");
function applyStatus(s) {
  setView(s.mode);
  if (s.mapSource) $("#mapSrc").value = s.mapSource;
  let txt = `mode: <b>${s.mode}</b>`;
  if (s.mode === "map") txt += ` · source: <b>${s.mapSource === "sdr" ? "dongle" : "online"}</b>`;
  if (s.mode === "listen") {
    txt += ` · <b>${Number(s.listen.freq).toFixed(3)}</b> MHz AM`;
    $("#dialFreq").textContent = Number(s.listen.freq).toFixed(3);
  }
  statusEl.classList.toggle("err", !!s.error);
  statusEl.innerHTML = s.error ? `⚠ ${s.error}` : txt;

  // (re)attach audio stream when in listen mode
  if (s.mode === "listen") {
    listening = true;
    if (!audio.src || audio.dataset.freq !== String(s.listen.freq)) {
      audio.dataset.freq = String(s.listen.freq);
      attachAudio();
    }
  } else {
    listening = false;
    audio.removeAttribute("src");
    audio.load();
  }
}

// Reconnect the MP3 stream if it drops — e.g. the server briefly restarts
// rtl_fm to recover from a device-busy race when switching frequencies.
let listening = false;
let reconnectTimer = null;
function attachAudio() {
  audio.src = "/audio?t=" + Date.now();
  audio.play().catch(() => {});
}
function scheduleReconnect() {
  if (!listening || reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; if (listening) attachAudio(); }, 900);
}
audio.addEventListener("ended", scheduleReconnect);
audio.addEventListener("error", scheduleReconnect);
audio.addEventListener("stalled", scheduleReconnect);

// ---- controls ----
async function setMode(payload) {
  await fetch("/api/mode", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
}
$("#bMap").onclick = () => setMode({ mode: "map", source: $("#mapSrc").value });
$("#mapSrc").onchange = () => { if ($("#bMap").classList.contains("on")) setMode({ mode: "map", source: $("#mapSrc").value }); };
$("#bStop").onclick = () => setMode({ mode: "idle" });
$("#bListen").onclick = () => tune();
$("#tune").onclick = () => tune();
function tune() {
  const freq = parseFloat($("#freq").value) || 124.0;
  const gainV = $("#gain").value.trim();
  const gain = gainV === "" ? "agc" : Number(gainV);
  const squelch = Number($("#squelch").value) || 0;
  setMode({ mode: "listen", freq, gain, squelch });
}
document.querySelectorAll(".presets button").forEach((b) => {
  b.onclick = () => { $("#freq").value = b.dataset.f; tune(); };
});
</script>
</body>
</html>
